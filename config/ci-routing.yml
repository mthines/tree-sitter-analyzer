# CI routing rules. Keep this file simple: scripts/ci_route.py intentionally
# supports only this small YAML subset so the route job can run before deps install.

always:
  run_quality: true
  run_test_matrix: true
  run_build: true
  upload_coverage: true
  full_language_once: true

# A change whose files ALL match these globs (and none trip full_suite) is
# "docs-only": skip the heavy Win/macOS test matrix + build, and run only the
# lightweight docs-check (README count/structure tests). README count drift is
# still caught because docs-check runs test_readme_counts_match_registry.
docs_only:
  - "*.md"
  - "**/*.md"
  - "docs/**"
  - "rfcs/**"
  - "LICENSE"

full_suite:
  - ".github/workflows/ci.yml"
  - ".github/workflows/reusable-test.yml"
  - ".github/actions/**"
  - "config/ci-routing.yml"
  - "scripts/ci_route.py"
  - "pyproject.toml"
  - "uv.lock"
  - "pytest.ini"
  - "tests/conftest.py"
  - "tests/contracts/**"
  - "tests/governance/**"

routes:
  run_e2e_smoke:
    - "codexray/mcp/**"
    - "codexray/cli/**"
    - "codexray/cli_main.py"
    - "tests/e2e/**"
    - ".github/workflows/ci.yml"
  run_regression:
    - "codexray/api.py"
    - "codexray/formatters/**"
    - "codexray/models.py"
    - "tests/regression/**"
    - "tests/compatibility/**"
    - "tests/golden_masters/**"
    - ".github/workflows/regression-tests.yml"
  run_sql_platform_compat:
    - "codexray/languages/sql_plugin/**"
    - "codexray/platform_compat/**"
    - "tests/unit/languages/*sql*"
    - "tests/platform_profiles/**"
    - "examples/*.sql"
    - ".github/workflows/sql-platform-compat.yml"
  run_benchmarks:
    - "benchmarks/**"
    - "tests/benchmarks/**"
    - "codexray/ast_cache.py"
    - "codexray/mcp/tools/utils/search_cache.py"
    - "codexray/mcp/tools/utils/change_impact_cached_graph.py"
    - ".github/workflows/benchmarks.yml"
  run_grammar_coverage:
    - "pyproject.toml"
    - "uv.lock"
    - "codexray/grammar_coverage/**"
    - "codexray/languages/**"
    - ".github/workflows/grammar-coverage-guard.yml"

scopes:
  regression_scope:
    default: "all"
    values:
      format:
        - "codexray/formatters/**"
        - "tests/regression/test_format_regression.py"
      api:
        - "codexray/api.py"
        - "tests/regression/test_api_regression.py"
      compatibility:
        - "tests/compatibility/**"
        - "pyproject.toml"
        - "uv.lock"
  benchmark_scope:
    default: "all"
    values:
      query:
        - "tests/benchmarks/test_query_performance.py"
        - "codexray/mcp/tools/query_code_tool.py"
      cache:
        - "codexray/ast_cache.py"
        - "codexray/mcp/tools/utils/search_cache.py"
      analysis:
        - "tests/benchmarks/test_large_file_performance.py"
        - "codexray/core/**"
      formatting:
        - "codexray/formatters/**"
